name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships with npm >=11.5.1, which is required for Trusted Publishing.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Verify package.json version matches git tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi

      # --provenance requires the repo to be public; npm rejects provenance
      # claims from private repos. If the repo is still private when this
      # runs, drop --provenance temporarily.
      - name: Publish (npm Trusted Publishing via OIDC, with provenance)
        run: npm publish --access public --provenance
